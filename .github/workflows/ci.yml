name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 이 job 이름이 그대로 필수 상태 체크 이름이 된다. ruleset(.github/ruleset-main.json)과 함께 바꿀 것.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # review-gate의 승인 판정 로직. 워크플로에서 떼어낸 이유가 테스트하기 위해서다.
      - name: review-gate 판정 로직 테스트
        run: bash .github/scripts/review-gate-decide.tests.sh

      # lockfile 그대로 설치한다. npm install은 조용히 버전을 올려 CI와 로컬이 갈라진다.
      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      # next build가 타입 검사도 하지만, 실패 지점을 갈라 놓으면 원인이 빨리 보인다.
      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 빌드
        run: npm run build

  # 브랜치 보호 훅도 코드다. 회귀하면 "main에 직접 쓰지 않는다"가 조용히 무너진다.
  # Windows PowerShell에서 도는 스크립트라 windows 러너가 필요하다.
  hook-tests:
    name: hook-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: guard-main 훅 테스트
        shell: powershell
        run: .\.claude\hooks\guard-main.tests.ps1

      # 워크플로 YAML이 깨지면 그 체크는 아예 나타나지 않는다. 머지는 막히지만(fail-safe)
      # 원인이 보이지 않으니, 파싱만이라도 여기서 확인한다.
      - name: 워크플로 YAML 파싱
        shell: bash
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for p in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              try:
                  yaml.safe_load(p.read_text(encoding='utf-8'))
                  print('OK  ', p)
              except Exception as e:
                  bad.append(p); print('FAIL', p, e)
          sys.exit(1 if bad else 0)
          PY
